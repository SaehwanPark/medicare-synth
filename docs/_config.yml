title: "Medicare-Synth"
tagline: "Medicare-like synthetic data for research prep"
description: "Explore artificial, Medicare-shaped datasets for methods testing before restricted CMS access—not for estimating the Medicare population."
url: "https://saehwanpark.github.io"
baseurl: "/medicare-synth"
repository: "SaehwanPark/medicare-synth"
markdown: kramdown
permalink: pretty
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - harness
  - goal.md
  - phase0
  - phase1
  - phase2
  - phase3
  - phase4
  - phase5
  - phase6
  - phase7
  - phase8
  - phase9
  - medicare-synth-project-proposal_20260720.md
  - medicare_synth_evidence_calibrated_playground_proposal.md
  - medicare_synth_documentation_reorganization_plan.md
